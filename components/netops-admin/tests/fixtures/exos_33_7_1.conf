#
# Module devmgr configuration.
#
configure snmp sysName "switch-example"
#
# Module vlan configuration.
#
configure vlan default delete ports all
configure vr VR-Default delete ports 1-12
configure vr VR-Default add ports 1-12
create vlan "DATA"
configure vlan DATA tag 10
create vlan "spare"
configure vlan spare description "unused"
configure vlan spare tag 3990
create vlan "voice"
configure vlan voice tag 20
create vlan "notag"
configure ports 1 display-string uplink
configure vlan DATA add ports 1-4 untagged
configure vlan voice add ports 5 tagged
configure vlan DATA ipaddress 192.0.2.2 255.255.255.0
#
# Module igmp configuration.
#
enable igmp snooping vlan "voice" fast-leave
