#config-version=FGT80F-8.0.0-FW-build0167-260420:opmode=0:vdom=0:user=example
#conf_file_ver=100000000000001
#buildno=0167
#global_vdom=1
config system global
    set hostname "fw-example"
end
config firewall address
    edit "none"
        set uuid 00000000-0000-4000-8000-000000000001
        set subnet 0.0.0.0 255.255.255.255
    next
    edit "all"
        set uuid 00000000-0000-4000-8000-000000000002
    next
    edit "srv-web"
        set uuid 00000000-0000-4000-8000-000000000003
        set comment "web server"
        set subnet 192.0.2.20 255.255.255.255
    next
    edit "spare-host"
        set uuid 00000000-0000-4000-8000-000000000004
        set comment "unused"
        set subnet 192.0.2.21 255.255.255.255
    next
    edit "grouped-host"
        set uuid 00000000-0000-4000-8000-000000000005
        set subnet 192.0.2.22 255.255.255.255
    next
    edit "docs-fqdn"
        set uuid 00000000-0000-4000-8000-000000000006
        set type fqdn
        set fqdn "www.example.com"
    next
    edit "colored-host"
        set uuid 00000000-0000-4000-8000-000000000007
        set subnet 192.0.2.23 255.255.255.255
        set color 5
    next
    edit "lab-net"
        set uuid 00000000-0000-4000-8000-000000000008
        set subnet 198.51.100.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "servers"
        set uuid 00000000-0000-4000-8000-000000000009
        set member "grouped-host"
    next
end
config firewall policy
    edit 1
        set name "web-in"
        set uuid 00000000-0000-4000-8000-00000000000a
        set srcintf "wan1"
        set dstintf "internal"
        set action accept
        set srcaddr "all"
        set dstaddr "srv-web"
        set schedule "always"
        set service "HTTPS"
    next
end
