[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-core"
version = "0.2.0"
description = "Shared access layer of the netops family: inventory, credential store, host key trust, SSH transport, audit records"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
