[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-auditor"
version = "0.2.8"
description = "Configuration audit for network devices, with the collection path inside the tool"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["netops-core==0.2.5"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/radek-cerny-soukr/netops"
Documentation = "https://github.com/radek-cerny-soukr/netops/blob/main/components/netops-auditor/README.md"
Changelog = "https://github.com/radek-cerny-soukr/netops/blob/main/components/netops-auditor/CHANGELOG.md"
Source = "https://github.com/radek-cerny-soukr/netops/tree/main/components/netops-auditor"
Issues = "https://github.com/radek-cerny-soukr/netops/issues"

[project.scripts]
netops-auditor = "netops_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netops_auditor = ["catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../netops-core/src"]
