[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-auditor"
version = "0.2.0"
description = "Configuration audit for network devices, with the collection path inside the tool"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = ["netops-core==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../netops-core/src"]
