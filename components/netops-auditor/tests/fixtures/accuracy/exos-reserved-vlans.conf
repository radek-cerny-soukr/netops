# Module vlan configuration.
enable ntp
configure syslog add 192.0.2.9 local1
disable telnet
configure vlan default delete ports all
create vlan users
configure vlan users tag 10
configure vlan Default add ports 1-4 untagged
configure vlan users add ports 5 untagged
configure vlan Mgmt ipaddress 192.0.2.5 255.255.255.0
