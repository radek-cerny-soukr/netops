config system global
    set hostname "fw-example"
    set timezone "04"
    set ssl-static-key-ciphers disable
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
    next
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "ntp.example.invalid"
        next
    end
end
config log syslogd setting
    set status enable
    set server "198.51.100.9"
end
config firewall address
    edit "lan-net"
        set subnet 198.51.100.0 255.255.255.0
        set comment "site
local network"
    next
end
config firewall service custom
    edit "web"
        set tcp-portrange 80 443
    next
end
config firewall vip
    edit "web-vip"
        set extip 192.0.2.10
        set mappedip "198.51.100.10"
        set extintf "wan1"
    next
end
config firewall vipgrp
    edit "web-vips"
        set interface "wan1"
        set member "web-vip"
    next
end
config firewall address6
    edit "lan6-net"
        set ip6 2001:db8:1::/64
    next
end
config firewall addrgrp6
    edit "lan6-group"
        set member "lan6-net"
    next
end
config firewall policy
    edit 1
        set name "lan-to-wan"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "lan-net"
        set dstaddr "all"
        set service "web"
        set action accept
        set schedule "always"
        set nat enable
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        unset comments
    next
    edit 7
        set name "wan-to-web"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "web-vip" "web-vips"
        set srcaddr6 "lan6-group"
        set service "web"
        set action accept
        set schedule "always"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
    next
end
