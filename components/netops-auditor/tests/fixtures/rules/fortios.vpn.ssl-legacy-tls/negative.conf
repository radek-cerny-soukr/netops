config system global
    set hostname "fw-example"
    set timezone "04"
    set log-single-cpu-high enable
    set ssl-static-key-ciphers disable
end
config system password-policy
    set status enable
    set apply-to admin-password ipsec-preshared-key
    set minimum-length 14
end
config system admin
    edit "netadmin"
        set accprofile "super_admin"
        set trusthost1 192.0.2.0 255.255.255.0
        set ip6-trusthost1 2001:db8::/32
    next
end
config antivirus settings
    set grayware enable
    set machine-learning-detection enable
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
    next
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "ntp.example.invalid"
        next
    end
end
config log syslogd setting
    set status enable
    set server "198.51.100.9"
end
config firewall address
    edit "lan-net"
        set subnet 198.51.100.0 255.255.255.0
        set comment "site
local network"
    next
end
config firewall service custom
    edit "web"
        set tcp-portrange 80 443
    next
end
config firewall policy
    edit 1
        set name "lan-to-wan"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "lan-net"
        set dstaddr "all"
        set service "web"
        set action accept
        set schedule "always"
        set nat enable
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set ips-sensor "default"
        set av-profile "default"
        set dnsfilter-profile "default"
        set application-list "default"
        unset comments
    next
end
config dnsfilter profile
    edit "default"
        set log-all-domain enable
    next
end
config application list
    edit "default"
        set enforce-default-app-port enable
    next
end
config vpn ssl settings
    set ssl-min-proto-ver tls1-2
    set ssl-max-proto-ver tls1-3
    set algorithm high
end
