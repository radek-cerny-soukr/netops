set system host-name example-switch
set system services ssh
set interfaces lo0 unit 0 family inet address 192.0.2.1/32
set interfaces lo0 unit 0 family inet filter input example-mgmt
set firewall family inet filter example-mgmt term allow from source-address 198.51.100.0/24
set firewall family inet filter example-mgmt term allow from protocol tcp
set firewall family inet filter example-mgmt term allow from destination-port ssh
set firewall family inet filter example-mgmt term allow then accept
