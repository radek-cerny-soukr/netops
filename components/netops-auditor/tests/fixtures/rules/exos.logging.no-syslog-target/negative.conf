#
# Module devmgr configuration.
#
configure snmp sysName "sw-example"
configure snmp sysLocation "Example Site"
#
# Module vlan configuration.
#
create vlan "OFFICE"
configure vlan OFFICE tag 10
configure vlan OFFICE add ports 1-4 untagged
configure vlan OFFICE ipaddress 192.0.2.2 255.255.255.0
create vlan "LAB"
configure vlan LAB tag 20
configure vlan LAB add ports 5-8 untagged
#
# Module aaa configuration.
#
disable radius mgmt-access
#
# Module ems configuration.
#
configure syslog add 2001:db8::9 local1
enable log target syslog 192.0.2.9 local1
configure log target syslog 192.0.2.9 local1 filter DefaultFilter severity Warning
#
# Module exsshd configuration.
#
enable ssh2
#
# Module netTools configuration.
#
configure sntp-client primary 192.0.2.1
enable sntp-client
#
# Module snmpMaster configuration.
#
configure snmpv3 add community office-index name office-read user v1v2c_ro
#
# Module telnetd configuration.
#
disable telnet
