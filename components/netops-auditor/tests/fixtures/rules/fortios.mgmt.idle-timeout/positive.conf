config system interface
    edit "port1"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping
        set role wan
    next
    edit "port2"
        set ip 198.51.100.1 255.255.255.0
        set allowaccess ping https
        set role lan
    next
end
config system ntp
    set ntpsync enable
end
config log syslogd setting
    set status enable
    set server "198.51.100.9"
end
config firewall address
    edit "office-net"
        set subnet 198.51.100.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "office-to-internet"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "office-net"
        set dstaddr "all"
        set service "HTTPS"
        set schedule "always"
        set action accept
        set ips-sensor "default"
        set av-profile "default"
        set dnsfilter-profile "default"
        set application-list "default"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
    next
end
config system global
    set log-single-cpu-high enable
    set hostname "fw-example"
    set ssl-static-key-ciphers disable
    set admintimeout 60
end
config dnsfilter profile
    edit "default"
        set log-all-domain enable
    next
end
config application list
    edit "default"
        set enforce-default-app-port enable
    next
end
config system password-policy
    set status enable
    set apply-to admin-password ipsec-preshared-key
    set minimum-length 14
end
config antivirus settings
    set grayware enable
    set machine-learning-detection enable
end
