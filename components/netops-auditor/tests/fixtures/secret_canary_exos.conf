#
# Module devmgr configuration.
#
configure snmp sysName "sw-canary"
configure snmp sysLocation "Example Site"
#
# Module vlan configuration.
#
create vlan "OFFICE"
configure vlan OFFICE tag 10
configure vlan OFFICE ipaddress 192.0.2.2 255.255.255.0
#
# Module aaa configuration.
#
create account admin operator
configure account admin encrypted "KANARCI-TAJEMSTVI-EXOS-01"
configure account operator encrypted "KANARCI-TAJEMSTVI-EXOS-02"
configure radius primary shared-secret encrypted "KANARCI-TAJEMSTVI-EXOS-03"
configure radius secondary 1 shared-secret encrypted "KANARCI-TAJEMSTVI-EXOS-04"
configure tacacs primary shared-secret encrypted "KANARCI-TAJEMSTVI-EXOS-05"
#
# Module exsshd configuration.
#
enable ssh2
create sshd2 user-key canary-key ssh-rsa-KANARCI-TAJEMSTVI-EXOS-06 comment "KANARCI-TAJEMSTVI-EXOS-07"
#
# Module snmpMaster configuration.
#
configure snmpv3 add community public name KANARCI-TAJEMSTVI-EXOS-08 user v1v2c_ro
configure snmp add community readwrite KANARCI-TAJEMSTVI-EXOS-09
configure snmpv3 add user canary authentication sha KANARCI-TAJEMSTVI-EXOS-10 privacy aes 256 KANARCI-TAJEMSTVI-EXOS-11
#
# Module telnetd configuration.
#
enable telnet
