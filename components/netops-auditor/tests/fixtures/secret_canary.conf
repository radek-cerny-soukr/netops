config system global
    set hostname "fw-canary.example.invalid"
    set admin-sport 8443
end
config system admin
    edit "auditor"
        set accprofile "super_admin"
        set password ENC CANARY-SECRET-01
    next
    edit "backup-operator"
        set accprofile "prof_admin"
        set password ENC CANARY-SECRET-02
        set comments "original password CANARY-SECRET-03"
    next
end
config system api-user
    edit "automation"
        set accprofile "prof_admin"
        set api-key ENC CANARY-SECRET-04
    next
end
config system snmp community
    edit 1
        set name "CANARY-SECRET-05"
    next
end
config system snmp user
    edit "monitor"
        set auth-pwd ENC CANARY-SECRET-06
        set priv-pwd ENC CANARY-SECRET-07
    next
end
config user radius
    edit "radius-primary"
        set server "192.0.2.53"
        set secret ENC CANARY-SECRET-08
    next
end
config user ldap
    edit "ldap-primary"
        set server "192.0.2.54"
        set username "cn=bind,dc=example,dc=invalid"
        set password ENC CANARY-SECRET-09
    next
end
config vpn ipsec phase1-interface
    edit "to-branch"
        set interface "port1"
        set remote-gw 192.0.2.200
        set psksecret ENC CANARY-SECRET-10
    next
end
config wireless-controller vap
    edit "office-wifi"
        set ssid "OFFICE-EXAMPLE"
        set passphrase ENC CANARY-SECRET-11
        set sae-password ENC CANARY-SECRET-12
    next
end
config vpn certificate local
    edit "audit-cert"
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
CANARY-SECRET-13
-----END ENCRYPTED PRIVATE KEY-----"
    next
end
config system ha
    set group-name "cluster-example"
    set password ENC CANARY-SECRET-14
end
config system email-server
    set server "smtp.example.invalid"
    set username "alert@example.invalid"
    set password ENC CANARY-SECRET-15
end
config router bgp
    set as 64512
    config neighbor
        edit "192.0.2.201"
            set remote-as 64513
            set password ENC CANARY-SECRET-16
        next
    end
end
config system sdn-connector
    edit "cloud-example"
        set type "aci"
        set secret-token ENC CANARY-SECRET-17
    next
end
config system interface
    edit "port1"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set role wan
        set password ENC CANARY-SECRET-20
    next
    edit "port2"
        set ip 198.51.100.1 255.255.255.0
        set allowaccess ping https
        set role lan
    next
end
config system ntp
    set ntpsync disable
end
config firewall address
    edit "office-net"
        set subnet 198.51.100.0 255.255.255.0
        set comment "shared secret CANARY-SECRET-18"
    next
end
config firewall policy
    edit 1
        set name "office-to-internet"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "office-net-typo"
        set dstaddr "all"
        set service "HTTPS"
        set schedule "always"
        set action accept
        set utm-status enable
        set comments "api token CANARY-SECRET-19"
        set ips-sensor "default"
        set av-profile "default"
        set dnsfilter-profile "default"
        set application-list "default"
    next
end
config dnsfilter profile
    edit "default"
        set log-all-domain enable
    next
end
config application list
    edit "default"
        set enforce-default-app-port enable
    next
end
config system auto-install
end
