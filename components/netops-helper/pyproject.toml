[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-helper"
version = "0.3.7"
description = "Read-only MCP engine for bounded network troubleshooting"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "netops-core==0.2.5",
  "fastmcp==4.0.5",
  "mcp==2.1.1",
  "httpx==0.28.1",
  "pysnmp==7.1.29",
  "icmplib==3.0.4",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/radek-cerny-soukr/netops"
Documentation = "https://github.com/radek-cerny-soukr/netops/blob/main/components/netops-helper/README.md"
Changelog = "https://github.com/radek-cerny-soukr/netops/blob/main/components/netops-helper/CHANGELOG.md"
Source = "https://github.com/radek-cerny-soukr/netops/tree/main/components/netops-helper"
Issues = "https://github.com/radek-cerny-soukr/netops/issues"

[project.scripts]
netops-helper-proxy = "netops_helper.proxy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../netops-core/src"]
