config system health-check
edit LB_HLTHCK_ICMP
    set type icmp
    set interval 5
    set timeout 3
    set retry 3
    set up-retry 1
    set dest-addr-type ipv4
    set dest-addr 0.0.0.0
next
edit LB_HLTHCK_HTTP
    set type http
    set interval 5
    set timeout 3
    set retry 3
    set up-retry 1
    set port 80
    set dest-addr-type ipv4
    set dest-addr 0.0.0.0
    set http-large-recv <UNVERIFIED:unclassified-field>
    set http-connect no_connect
    unset hostname
    set http-version http_1.1
    unset additional-string
    set method-type http_head
    set send-string /
    set status-code 200
    unset username
    unset password
next
edit LB_HLTHCK_HTTPS
