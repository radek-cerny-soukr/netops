name: Release candidate

on:
  push:
    branches:
      - release/1.0.4-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/radek-cerny-soukr/netops
  VERSION: 1.0.4
  BUILDKIT_IMAGE: moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
  SYFT_VERSION: 1.54.1
  GRYPE_VERSION: 0.120.1

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.14.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.9

      - name: Check the public source for private data and product identity
        run: python3 -B release/check_source.py

      - name: Refuse open placeholders other than the acceptance and the release date
        run: python3 -B release/placeholder_gate.py --version "$VERSION" --candidate

      - name: Install locked SBOM validation tooling
        run: 'python3 -m pip install --only-binary=:all: --require-hashes -r release/requirements-sbom.lock'

      - name: Test the release and acceptance tooling
        env:
          NETOPS_SIGN_TEST_WORKERS: "2"
        run: |
          set -euo pipefail
          for test in release/tests/test_*.py release/acceptance/tests/test_*.py release/sign/tests/test_*.py; do
            python3 -B "$test"
          done

  build:
    needs: tooling
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            syft_sha256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
            grype_sha256: 0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d
          - arch: arm64
            runner: ubuntu-24.04-arm
            syft_sha256: dfdf0537610113edbefe1f1fc6548bc957b2d77439636ec824fcf0e10d46d054
            grype_sha256: 29f47391dc283aa79fcc38e65224cd61f64dec0ecfd0db7074128ebf8ff23514
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install verified syft and grype
        env:
          ARCH: ${{ matrix.arch }}
          SYFT_SHA256: ${{ matrix.syft_sha256 }}
          GRYPE_SHA256: ${{ matrix.grype_sha256 }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          fetch() {
            archive="$RUNNER_TEMP/$1.tar.gz"
            curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" "https://github.com/anchore/$1/releases/download/v$2/$1_$2_linux_${ARCH}.tar.gz"
            echo "$3  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$tools" "$1"
          }
          fetch syft "$SYFT_VERSION" "$SYFT_SHA256"
          fetch grype "$GRYPE_VERSION" "$GRYPE_SHA256"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Build and push the image by digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name netops --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx build --platform "linux/$ARCH" --provenance=false --sbom=false --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          mkdir -p out
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/metadata.json" > "out/digest-$ARCH.txt"
          grep -Eqx 'sha256:[0-9a-f]{64}' "out/digest-$ARCH.txt"
          ref="$IMAGE@$(cat "out/digest-$ARCH.txt")"
          docker pull --platform "linux/$ARCH" "$ref"
          docker buildx imagetools inspect --raw "$ref" > "out/manifest-$ARCH.json"
          docker logout ghcr.io
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["config"]["digest"])' "out/manifest-$ARCH.json" > "out/config-$ARCH.txt"
          test "$(docker image inspect --format '{{.Id}}' "$ref")" = "$(cat "out/config-$ARCH.txt")"
          test "sha256:$(sha256sum "out/manifest-$ARCH.json" | cut -d' ' -f1)" = "$(cat "out/digest-$ARCH.txt")"
          docker save --output "out/netops-$ARCH.docker.tar" "$ref"

      - name: Run the image selftest from the pushed digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$(cat "out/digest-$ARCH.txt")"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 51000:51000 "$ref" selftest
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --cap-drop ALL \
            --security-opt no-new-privileges --user 51000:51000 --entrypoint python "$ref" -B -m unittest discover -s /opt/netops/tests -v

      - name: Generate the SBOM and scan the pushed digest
        env:
          ARCH: ${{ matrix.arch }}
          GRYPE_DB_CACHE_DIR: /tmp/grype-db
        run: |
          set -euo pipefail
          ref="$IMAGE@$(cat "out/digest-$ARCH.txt")"
          syft scan "docker:$ref" --output "cyclonedx-json=out/sbom-$ARCH.cdx.json"
          grype db update
          grype db check
          grype "docker:$ref" --output json --file "out/grype-$ARCH.json"
          python3 -B release/scan_gate.py "out/grype-$ARCH.json" --name "linux/$ARCH" --output "out/gate-$ARCH.json" --summary "$GITHUB_STEP_SUMMARY"
          python3 -B release/assessment_check.py "out/gate-$ARCH.json" --assessments release/vulnerability-assessments.json

      - name: Keep the build outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  index:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      index_digest: ${{ steps.manifest.outputs.index_digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.14.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.9

      - name: Install locked SBOM validation tooling
        run: 'python3 -m pip install --only-binary=:all: --require-hashes -r release/requirements-sbom.lock'

      - name: Collect the per-architecture outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: out
          merge-multiple: true

      - name: Create the multi-architecture index and the candidate manifest
        id: manifest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE:candidate-$GITHUB_SHA"
          docker buildx imagetools create --tag "$tag" "$IMAGE@$(cat out/digest-amd64.txt)" "$IMAGE@$(cat out/digest-arm64.txt)"
          docker buildx imagetools inspect --raw "$tag" > out/index.json
          index_digest="sha256:$(sha256sum out/index.json | cut -d' ' -f1)"
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io
          python3 -B release/candidate_manifest.py --version "$VERSION" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --image "$IMAGE" --index-digest "$index_digest" --index-raw out/index.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --dir out \
            --compose compose.yaml --env env.example --assessments release/vulnerability-assessments.json --release-dir out/release
          python3 -B release/report_gate.py out/release
          {
            echo "### Candidate"
            echo
            echo "Index: \`$IMAGE@$index_digest\`"
            echo
            echo '```'
            cat "out/release/netops-$VERSION-SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            out/
            !out/*.docker.tar
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: index
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      INDEX_DIGEST: ${{ needs.index.outputs.index_digest }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Collect the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: candidate

      - name: Prepare pinned age for confidential collector captures
        run: |
          python3 -B release/acceptance/process_profile_seal.py --install-dir "$RUNNER_TEMP/process-profile-age" --arch "$ARCH"

      - name: Start NetOps from the release files as the quickstart describes
        run: |
          set -euo pipefail
          (cd candidate/release && sha256sum -c "netops-$VERSION-SHA256SUMS")
          grep -qx "NETOPS_IMAGE=$IMAGE@$INDEX_DIGEST" candidate/release/env.example
          instance="$RUNNER_TEMP/instance"
          mkdir -p "$instance"
          cp candidate/release/compose.yaml candidate/release/env.example "$instance/"
          cd "$instance"
          cp env.example .env
          sed -i "s|^NETOPS_BIND_IP=.*|NETOPS_BIND_IP=127.0.0.1|; s|^NETOPS_PORT=.*|NETOPS_PORT=8443|; s|^NETOPS_SERVER_NAME=.*|NETOPS_SERVER_NAME=localhost|" .env
          docker compose pull --quiet
          umask 077
          docker compose run --rm -T netops init --audit local --accept-local-audit > "$RUNNER_TEMP/init.txt" 2>&1
          docker compose up -d > "$RUNNER_TEMP/up.txt" 2>&1
          docker compose run --rm -T netops ca > netops-ca.pem
          docker compose run --rm -T netops token show > token.txt
          docker compose logs --no-color > "$RUNNER_TEMP/container-after-up.txt" 2>&1
          mkdir -p "$GITHUB_WORKSPACE/reports"
          python3 -B "$GITHUB_WORKSPACE/release/acceptance/token_output.py" \
            --token-file "$instance/token.txt" --files "$RUNNER_TEMP/init.txt" "$RUNNER_TEMP/up.txt" "$RUNNER_TEMP/container-after-up.txt" \
            --allow-empty-file "$RUNNER_TEMP/container-after-up.txt" --commit "$GITHUB_SHA" --image-digest "$INDEX_DIGEST" \
            --output "$GITHUB_WORKSPACE/reports/acceptance-actions-$ARCH-token-output.json"
          docker compose run --rm -T netops connection

      - name: Black-box, red-team, fail-closed, syslog and device acceptance
        run: |
          set -euo pipefail
          instance="$RUNNER_TEMP/instance"
          mkdir -p reports
          rc=0
          python3 -B release/acceptance/blackbox.py --url https://localhost:8443/mcp --ca "$instance/netops-ca.pem" \
            --token-file "$instance/token.txt" --expect-name localhost --expect-tool helper_status --expect-tool read_query_catalog \
            --expect-tool list_rules --expect-tool audit_status --expect-tool admin_status --commit "$GITHUB_SHA" --image-digest "$INDEX_DIGEST" --wait-seconds 120 \
            --output "reports/acceptance-actions-$ARCH-blackbox.json" || rc=1
          python3 -B release/acceptance/redteam.py --compose-dir "$instance" --project netops --url https://localhost:8443/mcp \
            --ca "$instance/netops-ca.pem" --token-out "$instance/token.txt" --commit "$GITHUB_SHA" --image-digest "$INDEX_DIGEST" \
            --process-profile-dir "$RUNNER_TEMP/process-profile-collector" \
            --output "reports/acceptance-actions-$ARCH-redteam.json" || rc=1
          python3 -B release/acceptance/failclosed.py --compose-file candidate/release/compose.yaml --image "$IMAGE@$INDEX_DIGEST" --port 8444 \
            --commit "$GITHUB_SHA" --image-digest "$INDEX_DIGEST" --output "reports/acceptance-actions-$ARCH-failclosed.json" || rc=1
          python3 -B release/acceptance/syslog_delivery.py --compose-file candidate/release/compose.yaml --image "$IMAGE@$INDEX_DIGEST" \
            --port 8445 --commit "$GITHUB_SHA" --image-digest "$INDEX_DIGEST" --output "reports/acceptance-actions-$ARCH-syslog.json" || rc=1
          if [ ! -x /usr/sbin/sshd ] || [ ! -f /etc/ssh/ssh_host_ed25519_key.pub ]; then
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server > /dev/null
          fi
          systemctl is-active --quiet ssh.socket || systemctl is-active --quiet ssh || sudo systemctl start ssh
          python3 -B release/acceptance/device_read.py --compose-dir "$instance" --project netops --url https://localhost:8443/mcp \
            --ca "$instance/netops-ca.pem" --token-file "$instance/token.txt" --commit "$GITHUB_SHA" --image-digest "$INDEX_DIGEST" \
            --output "reports/acceptance-actions-$ARCH-device.json" || rc=1
          python3 -B release/report_gate.py reports || rc=1
          exit "$rc"

      - name: Stop the instance
        if: ${{ always() }}
        run: |
          cd "$RUNNER_TEMP/instance" && docker compose down -v --remove-orphans || true

      - name: Keep the acceptance reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-actions-${{ matrix.arch }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Seal the private collector captures
        id: collector-seal
        if: ${{ always() }}
        run: |
          python3 -B release/acceptance/process_profile_seal.py --directory "$RUNNER_TEMP/process-profile-collector" --age-dir "$RUNNER_TEMP/process-profile-age"

      - name: Keep the encrypted collector captures
        if: ${{ always() && steps.collector-seal.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-profile-sealed-${{ matrix.arch }}
          path: ${{ runner.temp }}/process-profile-sealed/
          if-no-files-found: error
          retention-days: 30

  engine:
    needs: index
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        role: [core, helper, auditor, admin]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NETOPS_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.index.outputs.index_digest }}
      CANDIDATE_COMMIT: ${{ github.sha }}
      ARCH: ${{ matrix.arch }}
      ROLE: ${{ matrix.role }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Engine functional regression on the exact candidate image (docs/testing-1.0.md)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p qualification reports
          chmod 0700 qualification
          docker build --build-arg NETOPS_TEST_IMAGE="$NETOPS_IMAGE" -f release/engine-regression.Dockerfile -t netops-engine-tests .
          mkdir -p "qualification/$ROLE"
          chmod 0777 "qualification/$ROLE"
          status=0
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,exec,size=512m,mode=1777 --tmpfs /pytmp:rw,nosuid,nodev,exec,size=512m,mode=1777 --mount "type=bind,source=$PWD/qualification/$ROLE,target=/reports" netops-engine-tests --role "$ROLE" --candidate-commit "$CANDIDATE_COMMIT" --candidate-image "${NETOPS_IMAGE#*@}" --output /reports/engine-report.json > "qualification/$ROLE.log" 2>&1 || status=$?
          tail -n 5 "qualification/$ROLE.log"
          cp "qualification/$ROLE/engine-report.json" "reports/acceptance-actions-$ARCH-engine-$ROLE.json"
          python3 -B release/report_gate.py reports
          test "$status" -eq 0

      - name: Keep the engine report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-actions-${{ matrix.arch }}-engine-${{ matrix.role }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
