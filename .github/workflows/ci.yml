name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.13.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15

      - name: Verify the repository tree and every component gate
        run: |
          python tests/test_release_gate.py
          python scripts/check_release.py

  netops-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: components/netops-helper
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.13.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15

      - name: Install locked runtime and test tools
        run: python -m pip install --require-hashes -r requirements-release.lock

      - name: Run offline verification
        run: |
          PYTHONPATH=src python tests/run_tests.py
          NETOPS_REQUIRE_RUNTIME_TESTS=1 python -m pytest -q
          python scripts/generate_sbom.py
          git diff --exit-code -- sbom.cdx.json
          python scripts/check_public_release.py
          python scripts/create_release_artifacts.py --output dist

      - name: Verify the exported archive stands alone
        run: |
          mapfile -t exported < <(find dist -mindepth 1 -maxdepth 1 -type d)
          if [ "${#exported[@]}" -ne 1 ]; then
            echo "expected exactly one exported directory in dist/, found: ${exported[*]}" >&2
            exit 1
          fi
          target="$RUNNER_TEMP/netops-helper-standalone"
          rm -rf "$target"
          cp -a "${exported[0]}" "$target"
          test -f "$target/compose.yaml"
          test -f "$target/Dockerfile"
          test -f "$target/src/netops_core/__init__.py"
          (cd "$target" && python -B scripts/check_public_release.py)

  netops-auditor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: components/netops-auditor
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.13.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15

      - name: Install locked runtime and test tools
        run: python -m pip install --require-hashes -r requirements-release.lock

      - name: Run offline verification
        env:
          PYTHONPATH: ../netops-core/src
        run: |
          python -m pytest -q
          python scripts/generate_sbom.py
          git diff --exit-code -- sbom.cdx.json
          python scripts/check_gates.py
          python scripts/create_release_artifacts.py --output dist

      - name: Verify the exported archive stands alone
        run: |
          mapfile -t exported < <(find dist -mindepth 1 -maxdepth 1 -type d)
          if [ "${#exported[@]}" -ne 1 ]; then
            echo "expected exactly one exported directory in dist/, found: ${exported[*]}" >&2
            exit 1
          fi
          target="$RUNNER_TEMP/netops-auditor-standalone"
          rm -rf "$target"
          cp -a "${exported[0]}" "$target"
          (cd "$target" && PYTHONPATH="$GITHUB_WORKSPACE/components/netops-core/src" python -B scripts/check_gates.py)

  netops-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: components/netops-core
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.13.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15

      - name: Install locked runtime and test tools
        run: python -m pip install --require-hashes -r requirements-release.lock

      - name: Run offline verification
        run: |
          python -m pytest -q
          python scripts/generate_sbom.py
          git diff --exit-code -- sbom.cdx.json
          python scripts/check_gates.py
          python scripts/create_release_artifacts.py --output dist

      - name: Verify the exported archive stands alone
        run: |
          mapfile -t exported < <(find dist -mindepth 1 -maxdepth 1 -type d)
          if [ "${#exported[@]}" -ne 1 ]; then
            echo "expected exactly one exported directory in dist/, found: ${exported[*]}" >&2
            exit 1
          fi
          target="$RUNNER_TEMP/netops-core-standalone"
          rm -rf "$target"
          cp -a "${exported[0]}" "$target"
          (cd "$target" && python -B scripts/check_gates.py)
