name: CI

on:
  push:
    branches-ignore:
      - "release/1.0.4-candidate"
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.14.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.9

      - name: Check the public source for private data and product identity
        run: python -B release/check_source.py

      - name: Install locked SBOM validation tooling
        run: 'python3 -m pip install --only-binary=:all: --require-hashes -r release/requirements-sbom.lock'

      - name: Test the release and acceptance tooling
        env:
          NETOPS_SIGN_TEST_WORKERS: "2"
        run: |
          set -euo pipefail
          for test in release/tests/test_*.py release/acceptance/tests/test_*.py release/sign/tests/test_*.py; do
            python -B "$test"
          done

      - name: Build the native product image from locked dependencies
        run: |
          set -euo pipefail
          docker build --pull --iidfile "$RUNNER_TEMP/netops-ci-unit.iid" .

      - name: Run the installed product unit tests
        run: |
          set -euo pipefail
          ref="$(cat "$RUNNER_TEMP/netops-ci-unit.iid")"
          [[ "$ref" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --cap-drop ALL \
            --security-opt no-new-privileges --user 51000:51000 --entrypoint python "$ref" -B -m unittest discover -s /opt/netops/tests -v
